# =============================================================================
# Identificação do experimento
# =============================================================================

experiment:
  # Identificador usado na organização dos resultados.
  id: "unicast-demo-01"

  # Semente para operações aleatórias, como mobilidade.
  # A mobilidade ainda não está habilitada nesta versão.
  seed: 42

  # Duração máxima do experimento.
  #
  # Em modo idle, define por quanto tempo a topologia permanece ativa.
  # Durante a execução dos binários, também funciona como timeout máximo.
  duration_seconds: 60


# =============================================================================
# Containers e artefatos do protocolo
# =============================================================================

containers:
  # Imagem usada por padrão para criar os containers.
  image: "drone:latest"

  # Diretório dentro dos containers no qual a pasta bin/ do projeto
  # será montada em modo somente leitura.
  binaries_directory: "/opt/protocol/bin"

  # Caminhos relativos a binaries_directory.
  #
  # No host:
  #   Demo-1-Testbed/bin/sender
  #   Demo-1-Testbed/bin/receiver
  #
  # Nos containers:
  #   /opt/protocol/bin/sender
  #   /opt/protocol/bin/receiver
  sender_binary: "sender"
  receiver_binary: "receiver"


# =============================================================================
# Política de execução
# =============================================================================

execution:
  # Se false, cria a topologia e coleta as métricas, mas não executa
  # sender e receiver.
  enabled: true

  # Comportamento quando um binário necessário não existe ou não possui
  # permissão de execução.
  #
  # Valores possíveis:
  #
  #   idle:
  #     mantém a topologia ativa durante experiment.duration_seconds,
  #     sem gerar tráfego artificial de aplicação.
  #
  #   skip:
  #     cria e configura a topologia, coleta os snapshots e encerra
  #     sem aguardar experiment.duration_seconds.
  #
  #   fail:
  #     considera a ausência dos binários um erro fatal.
  missing_binaries: "idle"


# =============================================================================
# Rede
# =============================================================================

network:
  # Interface lógica criada pelo BATMAN-adv.
  interface: "bat0"

  # Rede usada pelos binários sender e receiver.
  subnet: "192.168.123.0/24"

  wireless:
    # Configuração da célula ad hoc.
    ssid: "adhocNet"
    mode: "g"
    channel: 5
    bssid: "02:11:22:33:44:55"

    # Capacidade utilizada na criação dos enlaces ad hoc.
    ht_cap: "HT40+"

  # Configuração do meio sem fio emulado pelo wmediumd.
  medium:
    # Nesta versão, o único modo implementado é interference.
    #
    # Esse modo considera posição, potência de transmissão, ruído,
    # fading, propagação e interferência entre transmissões.
    mode: "interference"

    # Limiar de ruído utilizado pelo wmediumd, em dBm.
    noise_threshold_dbm: -91

    # Coeficiente de fading utilizado pelo wmediumd.
    fading_coefficient: 3

    propagation:
      # Modelo de propagação utilizado pelo Mininet-WiFi.
      model: "logDistance"

      # Expoente de perda do modelo log-distance.
      exponent: 3.5


# =============================================================================
# Nós
# =============================================================================

# Cada item representa um container da topologia.
#
# identity:
#   nome lógico utilizado nas referências do cenário.
#
# container_name:
#   nome curto utilizado pelo Containernet. O nome deve permitir que a
#   interface "<container_name>-wlan0" tenha no máximo 15 caracteres.
#
# roles:
#   pode conter "sender", "receiver", ambos ou permanecer vazio.
#
# ip:
#   endereço operacional atribuído à interface bat0.
#
# position:
#   posição inicial usada pelo modelo de propagação.
#
# txpower_dbm:
#   potência de transmissão do nó.
#
# range_meters:
#   alcance configurado no Mininet-WiFi.

nodes:
  - identity: "drone-1"
    container_name: "dr1"
    type: "drone"
    image: "drone:latest"
    memory: "4g"

    ip: "192.168.123.1/24"

    roles:
      - sender

    position:
      x: 10
      y: 20
      z: 0

    txpower_dbm: 10
    range_meters: 25

  - identity: "drone-2"
    container_name: "dr2"
    type: "drone"
    image: "drone:latest"
    memory: "4g"

    ip: "192.168.123.2/24"

    roles:
      - receiver

    position:
      x: 30
      y: 40
      z: 0

    txpower_dbm: 10
    range_meters: 25

  - identity: "drone-3"
    container_name: "dr3"
    type: "drone"
    image: "drone:latest"
    memory: "4g"

    ip: "192.168.123.3/24"

    roles:
      - receiver

    position:
      x: 27
      y: 33
      z: 0

    txpower_dbm: 10
    range_meters: 25

  - identity: "gcs"
    container_name: "gcs0"
    type: "gcs"
    image: "drone:latest"
    memory: "16g"

    ip: "192.168.123.5/24"

    roles:
      - sender
      - receiver

    position:
      x: 10
      y: 10
      z: 0

    txpower_dbm: 10
    range_meters: 25


# =============================================================================
# Mobilidade
# =============================================================================

mobility:
  # A versão atual do run.py aceita apenas topologia estática.
  enabled: false
  model: "static"

  # Estes valores ficam preparados para a implementação futura.
  update_interval_seconds: 1

  speed_mps:
    min: 1
    max: 5


# =============================================================================
# Comunicação
# =============================================================================

communication:
  # Valores possíveis:
  #   unicast
  #   broadcast
  mode: "unicast"

  # Porta utilizada por receivers e senders.
  port: 9000

  transmission:
    # Quantidade passada ao sender por meio de --count.
    count: 10

    # Campo reservado para uma possível extensão futura.
    #
    # O contrato atual não define --interval-ms; portanto, o run.py ainda
    # não passa este valor para o sender.
    #interval_ms: 1000

  # Fluxos utilizados quando mode é unicast.
  #
  # Cada fluxo cria uma execução independente do sender.
  flows:
    - source: "drone-1"
      destination: "drone-2"

  # Fontes utilizadas quando mode é broadcast.
  #
  # Em um cenário unicast, esta lista deve permanecer vazia.
  #
  # Exemplo simples:
  #
  # broadcasts:
  #   - "drone-1"
  #
  # Exemplo com endereço explicitamente definido:
  #
  # broadcasts:
  #   - source: "drone-1"
  #     destination: "192.168.123.255"
  broadcasts: []


# =============================================================================
# Estado READY dos receivers
# =============================================================================

readiness:
  # Linha exata que cada receiver deve escrever em stdout depois de estar
  # efetivamente disponível para receber mensagens.
  expected_output: "READY"

  # Tempo máximo para todos os receivers alcançarem o estado READY.
  timeout_seconds: 10


# =============================================================================
# Finalização do experimento
# =============================================================================

termination:
  # Valores possíveis:
  #
  #   senders_completed:
  #     termina quando todos os senders encerram, respeitando também
  #     experiment.duration_seconds como limite máximo.
  #
  #   duration_elapsed:
  #     mantém o experimento até experiment.duration_seconds, mesmo que
  #     os senders terminem antes.
  condition: "senders_completed"

  # Tempo concedido para um processo encerrar depois de receber SIGTERM.
  # Após esse período, o run.py utiliza SIGKILL.
  shutdown_timeout_seconds: 5


# =============================================================================
# Medições
# =============================================================================

measurements:
  # Liga ou desliga globalmente a coleta de métricas.
  enabled: true

  # Frequência de amostragem dos contadores das interfaces.
  sampling_interval_seconds: 1

  process: 
    # Captura informações dos processos sender e receiver.
  #  enabled: true 
  # removido o enable pois o codigo nao respeita. o run.py sempre usa apenas capture_stdout/stderr

    # Armazena a saída padrão dos binários.
    capture_stdout: true

    # Armazena a saída de diagnóstico dos binários.
    capture_stderr: true

  packet_capture:
    # Inicia tcpdump antes da execução dos binários.
    enabled: true

    # Interfaces capturadas em cada nó.
    #
    # "bat0":
    #   captura o tráfego operacional visto pelos binários.
    #
    # "wlan0":
    #   é um nome lógico convertido pelo run.py para dr1-wlan0,
    #   dr2-wlan0, gcs0-wlan0 etc.
    #
    # Recomenda-se começar apenas com bat0 para reduzir o volume dos PCAPs.
    interfaces:
      - "bat0"

    # Número máximo de bytes capturados por pacote.
    #
    # 0 significa capturar o pacote completo.
    snaplen: 0

    # Solicita que o tcpdump entregue os pacotes imediatamente.
    immediate_mode: true

    # Filtro BPF opcional.
    #
    # Vazio captura todo o tráfego da interface.
    #
    # Exemplos:
    #   "port 9000"
    #   "udp port 9000"
    #   "tcp port 9000"
    filter: ""

  interface_counters:
    # Coleta os contadores do kernel Linux no início, periodicamente
    # e no final do experimento.
    enabled: true

    # "wlan0" é convertido para a interface sem fio real de cada nó.
    interfaces:
      - "bat0"
      - "wlan0"

  batman:
    # Captura interfaces, vizinhos, originators e estatísticas
    # do BATMAN-adv.
    enabled: true

    # O run.py atual captura snapshots no início e no final.
    # A coleta periódica fica reservada para uma versão futura.
    #collect_periodically: false 

  wmediumd:
    # A integração atual não garante um arquivo de log estável e separado
    # por experimento. Se habilitado, o summary.json registrará um aviso.
    capture_log: false

  active_probes:
    # Sondas como ping e iperf geram tráfego e podem interferir no
    # experimento. Permanecem desabilitadas por padrão.
    enabled: false


# =============================================================================
# Resultados
# =============================================================================

results:
  # Caminhos relativos são resolvidos a partir da raiz do projeto.
  directory: "./logs"