# Identificação e duração máxima do experimento.
experiment:
  id: "unicast-demo-01"
  seed: 42
  duration_seconds: 60

# Artefatos do protocolo.
containers:
  image: "drone:latest"

  # Demo-1-Testbed/bin é montado neste diretório.
  binaries_directory: "/opt/protocol/bin"

  # Caminhos relativos a binaries_directory.
  sender_binary: "sender"
  receiver_binary: "receiver"

# Comportamento quando sender ou receiver não estiver disponível.
execution:
  enabled: true

  # Valores possíveis:
  #
  #   fail:
  #     interrompe a execução se algum binário necessário estiver ausente.
  #
  #   idle:
  #     não executa nenhum binário e mantém a topologia ativa durante
  #     experiment.duration_seconds, sem gerar tráfego artificial.
  #
  #   skip:
  #     configura e valida a topologia, mas encerra sem executar o experimento.
  missing_binaries: "idle"

network:
  interface: "bat0"
  subnet: "192.168.123.0/24"

  wireless:
    ssid: "adhocNet"
    mode: "g"
    channel: 5
    bssid: "02:11:22:33:44:55"
    ht_cap: "HT40+"

  # O wmediumd modela o meio sem fio.
  medium:
    # Inicialmente, apenas interference será executado.
    mode: "interference"

    noise_threshold_dbm: -91
    fading_coefficient: 3

    propagation:
      model: "logDistance"
      exponent: 3.5

# Cada item representa um container.
nodes:
  - identity: "drone-1"
    container_name: "dr1"
    type: "drone"
    ip: "192.168.123.1/24"
    roles:
      - sender
    position:
      x: 10
      y: 20
      z: 0
    txpower_dbm: 10
    range_meters: 25

  - identity: "drone-2"
    container_name: "dr2"
    type: "drone"
    ip: "192.168.123.2/24"
    roles:
      - receiver
    position:
      x: 30
      y: 40
      z: 0
    txpower_dbm: 10
    range_meters: 25

  - identity: "drone-3"
    container_name: "dr3"
    type: "drone"
    ip: "192.168.123.3/24"
    roles:
      - receiver
    position:
      x: 27
      y: 33
      z: 0
    txpower_dbm: 10
    range_meters: 25

  - identity: "gcs"
    container_name: "gcs0"
    type: "gcs"
    ip: "192.168.123.5/24"
    roles:
      - sender
      - receiver
    position:
      x: 10
      y: 10
      z: 0
    txpower_dbm: 10
    range_meters: 25

mobility:
  enabled: false
  model: "static"

  update_interval_seconds: 1

  speed_mps:
    min: 1
    max: 5

communication:
  mode: "unicast"
  port: 9000

  transmission:
    count: 10
    interval_ms: 1000

  flows:
    - source: "drone-1"
      destination: "drone-2"

  broadcasts: []

readiness:
  expected_output: "READY"
  timeout_seconds: 10

termination:
  # Valores possíveis:
  #   senders_completed
  #   duration_elapsed
  condition: "senders_completed"

  shutdown_timeout_seconds: 5

measurements:
  enabled: true

  # Intervalo usado na coleta de contadores.
  sampling_interval_seconds: 1

  process:
    enabled: true

    # Captura stdout, stderr, horários e códigos de saída.
    capture_stdout: true
    capture_stderr: true

  packet_capture:
    enabled: true

    # bat0 oferece a visão operacional do protocolo e do roteamento.
    interfaces:
      - "bat0"

    # Captura completa. Um valor maior que zero limita os bytes
    # capturados de cada pacote.
    snaplen: 0

    # Evita perda de informações por buffering no tcpdump.
    immediate_mode: true

    # Filtro BPF opcional. Vazio captura todo o tráfego.
    filter: ""

  interface_counters:
    enabled: true

    interfaces:
      - "bat0"
      - "wlan0"

  batman:
    enabled: true

    # Coleta periódica pode gerar overhead. Inicialmente coletamos
    # apenas no começo e no final.
    collect_periodically: false

  wmediumd:
    # Guardar logs do processo quando eles estiverem acessíveis.
    capture_log: true

  active_probes:
    # Ping e iperf geram tráfego e influenciam o experimento.
    # Devem ficar desabilitados nas avaliações normais.
    enabled: false

results:
  directory: "./logs"