experiment:
  id: exp-01-unicast
  duration_seconds: 60
  receiver_startup_seconds: 1.0
  shutdown_timeout_seconds: 5.0

protocol:
  mode: unicast
  port: 5000
  count: 100
  sender: drone1
  receivers:
    - gcs

wireless:
  ssid: meshNet
  mode: g
  channel: 5
  ht_cap: HT40+
  noise_threshold_dbm: -91
  fading_coefficient: 3
  propagation_model: logDistance
  propagation_exponent: 3.5
  subnet: 192.168.123.0/24
  broadcast_ip: 192.168.123.255
  interface: bat0

nodes:
  - id: gcs
    container_name: gcs0
    ip: 192.168.123.1/24
    position: [0, 0, 0]
    image: drone:latest
    memory: 512m
    txpower: 10
    range: 25
  - id: drone1
    container_name: dr1
    ip: 192.168.123.2/24
    position: [25, 0, 0]
    image: drone:latest
    memory: 512m
    txpower: 10
    range: 25

binaries:
  sender: bin/sender
  receiver: bin/receiver

output:
  pcap: logs/exp-01-unicast.pcap
  csv: logs/exp-01-unicast.csv
  summary: logs/exp-01-unicast-summary.json
